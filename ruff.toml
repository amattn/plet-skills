line-length = 120
target-version = "py38"

[lint]
select = [
    "E", "F", "W",  # The basics
    "I",             # Import sorting
    "N",             # Naming conventions
    "UP",            # Modern Python syntax
    "B",             # Bug prevention
    "SIM",           # Code simplification
    "C90",           # Complexity checks (McCabe)
]
ignore = [
    "C901",   # complex-structure — many commands are inherently complex, refactor later
]
